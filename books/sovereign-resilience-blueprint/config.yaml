title: "自律分散型レジリエンス国家の設計図 ―― AI有事・気候激甚化時代におけるシステム統合アプローチと技術者の役割"
summary: "境界防御が崩壊し、少子化と災害で国家インフラが局所撤退する時代。インフラの全面切断時にも、ローカルLANでしなやかに縮退運転できる自律生存システムの構築方法を解説。オストロムのコモンズ論、ソルニットの災害ユートピア、そしてWOTAやPowerXの先駆的事例を架橋し、一技術者が真の地域レジリエンスに貢献するための実践的なシステム設計図を提示します。"
